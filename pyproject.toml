[project]
name = "studylife-mcp"
dynamic = ["version"]
description = "MCP server exposing StudyLife (Blazor WASM + ASP.NET Core) to Claude and other MCP clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Already a transitive dep of mcp; declared explicitly because client.py imports it
    # directly to verify TLS against the OS certificate store (see client.py) rather than
    # only certifi's bundle - needed to trust locally-registered dev certs, e.g. the
    # ASP.NET Core HTTPS dev cert (`dotnet dev-certs https --trust`).
    "truststore>=0.9",
    # Async SQLite for the S4 OAuth store (oauth_store.py) - the HTTP+OAuth server may
    # serve multiple users concurrently, unlike the single-user stdio path, so a blocking
    # sqlite3 call per request is worth avoiding. Same choice studylife-ai made for its
    # own per-user key store.
    "aiosqlite>=0.20",
    # Already a transitive dep of mcp (used internally for its own JOSE/JWT handling);
    # declared explicitly because oauth_store.py uses it directly (Fernet) to encrypt
    # each user's StudyLife API key at rest - unlike StudyLife's own key storage, this
    # server needs the plaintext back to call StudyLife on the user's behalf, so it can't
    # just hash it.
    "cryptography>=42",
    # Metrics for the HTTP transport's /metrics endpoint (scraped by the existing
    # self-hosted Prometheus, studylife repo's k8s/14-prometheus.yaml, same setup
    # studylife-ai already uses). Plain prometheus-client rather than
    # prometheus-fastapi-instrumentator (studylife-ai's choice) - this server isn't
    # FastAPI, and the metrics that matter here (tool calls, rate-limit rejections) are
    # hand-registered anyway, not auto-instrumented HTTP request/response metrics.
    "prometheus-client>=0.20",
]

[project.scripts]
studylife-mcp = "studylife_mcp.server:main"
studylife-mcp-http = "studylife_mcp.server:main_http"
studylife-mcp-login = "studylife_mcp.login:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/studylife_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/studylife_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["studylife_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
