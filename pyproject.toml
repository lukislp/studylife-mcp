[project]
name = "studylife-mcp"
version = "0.1.0"
description = "MCP server exposing StudyLife (Blazor WASM + ASP.NET Core) to Claude and other MCP clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Already a transitive dep of mcp; declared explicitly because client.py imports it
    # directly to verify TLS against the OS certificate store (see client.py) rather than
    # only certifi's bundle - needed to trust locally-registered dev certs, e.g. the
    # ASP.NET Core HTTPS dev cert (`dotnet dev-certs https --trust`).
    "truststore>=0.9",
]

[project.scripts]
studylife-mcp = "studylife_mcp.server:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studylife_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["studylife_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
