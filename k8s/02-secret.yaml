# IMPORTANT: both values below are placeholders - this repo is public, real secret material
# must never be committed. STUDYLIFE_API_KEY is the stdio-mode/fallback account only; in
# normal operation every real caller authenticates via its own OAuth login (see README
# "Setup: Streamable HTTP + OAuth 2.1"), so this value is rarely if ever actually exercised -
# fill it in whenever convenient by generating a key on StudyLife's own setup page.
# MCP_TOKEN_ENCRYPTION_KEY encrypts every user's StudyLife API key at rest in the OAuth DB -
# generate a real one with `python -c "from cryptography.fernet import Fernet;
# print(Fernet.generate_key().decode())"` and apply it directly with kubectl, never via git.
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole (studylife repo's
# k8s/flux/06-reconciler-rbac.yaml) grants no permission on the "secrets" resource at all.
# Applied once by hand (kubectl apply -f k8s/02-secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: studylife-mcp-secrets
  namespace: studylife-mcp
type: Opaque
stringData:
  STUDYLIFE_API_KEY: "REPLACE-ME"
  MCP_TOKEN_ENCRYPTION_KEY: "REPLACE-ME"
