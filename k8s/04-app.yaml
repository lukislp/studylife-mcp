# The service itself. Image tag is a placeholder ("0.1.0") overwritten by Flux's
# ImageUpdateAutomation the moment the studylife repo's k8s/flux/15-studylife-mcp-image-update-
# automation.yaml first reconciles against a real published tag. Dockerfile creates "appuser"
# with an explicit numeric --uid 1000, so runAsNonRoot/runAsUser is safe without live
# inspection - this repo's own Dockerfile, not an opaque third-party image.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studylife-mcp-data
  namespace: studylife-mcp
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml) instead
  # of the cluster default local-path - oauth.db (every connected MCP client's OAuth
  # registrations/tokens) survives a node dying instead of needing a Velero restore.
  storageClassName: longhorn
  resources:
    requests: {storage: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylife-mcp
  namespace: studylife-mcp
spec:
  replicas: 1
  strategy:
    # Single instance with an RWO volume - oauth.db is a plain SQLite file (oauth_store.py),
    # not built for concurrent writers, same reasoning as studylife-ai/Qdrant/uptime-kuma.
    type: Recreate
  selector:
    matchLabels: {app: studylife-mcp}
  template:
    metadata:
      labels: {app: studylife-mcp}
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup (cluster/10-velero-values.yaml
        # there): /app/data holds oauth.db - the OAuth client registrations and tokens of
        # every connected MCP client. Losing it means re-authorizing each client by hand.
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Makes the PVC mount group-writable by UID 1000 on first mount - without this, a
        # freshly-provisioned PersistentVolume is root-owned and the non-root container gets
        # "Permission denied" writing to /app/data/oauth.db.
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studylife-mcp
          image: ghcr.io/lukislp/studylife-mcp:1.14.30 # set by the deploy-bump job (CI) on every release
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            # oauth.db on the PVC below is the only thing this service persists; the image
            # layer is never written to. /tmp still needs to be writable - that is where
            # Python's tempfile module and the outbound HTTP client put scratch files.
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef: {name: studylife-mcp-config}
            - secretRef: {name: studylife-mcp-secrets}
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 100m, memory: 200Mi}
            limits: {cpu: 500m, memory: 512Mi}
          # Both probes set timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for the arm64 Raspberry Pi nodes this runs on: the weakest node sits close
          # to its memory limit, so an ordinary load spike pushes /health past one second,
          # the liveness probe fails failureThreshold times in a row and kubelet restarts a
          # container that was only busy.
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: studylife-ca
              mountPath: /etc/studylife-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: studylife-mcp-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: studylife-ca
          configMap: {name: studylife-internal-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: studylife-mcp
  namespace: studylife-mcp
spec:
  type: ClusterIP
  selector: {app: studylife-mcp}
  ports:
    - port: 8000
      targetPort: 8000
