# Default-deny ingress baseline, egress stays open (this server calls out to StudyLife and,
# in HTTP+OAuth mode, is called by whatever remote MCP client - no fixed egress allowlist,
# same strategy as studylife-ai's own k8s/05-network-policies.yaml). Bootstrap-only, NOT
# Flux-managed - kustomize-controller's ClusterRole (studylife repo's
# k8s/flux/06-reconciler-rbac.yaml) has no "networkpolicies" permission.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: studylife-mcp
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: studylife-mcp
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - {} # egress otherwise unrestricted - this policy only adds an explicit DNS allowance
---
# Lets the Gateway (NGF data plane, k8s/06-httproute.yaml) reach the pod - same pattern as
# studylife's own k8s/12-network-policies.yaml "allow-nginx-gateway-to-*" rules. Port 8000 is
# the pod's real container port (matches the Service's targetPort - no port-remapping here,
# unlike e.g. studylife-web's 8080/8443 split).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-gateway-to-studylife-mcp
  namespace: studylife-mcp
spec:
  podSelector: { matchLabels: { app: studylife-mcp } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: nginx-gateway } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Lets the Tailscale operator's ingress proxy (k8s/07-tailscale-funnel.yaml, a single-replica
# StatefulSet the operator creates in its own "tailscale" namespace, not this one) reach the
# pod. This is the ONLY path that can make this service reachable from outside the tailnet -
# see k8s/07-tailscale-funnel.yaml's own comment for how public exposure is scoped to just
# this one Ingress's proxy via a dedicated Tailscale tag.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-studylife-mcp
  namespace: studylife-mcp
spec:
  podSelector: { matchLabels: { app: studylife-mcp } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: tailscale } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Lets the existing self-hosted Prometheus (studylife repo's k8s/14-prometheus.yaml) scrape
# /metrics - it reaches pods directly (kubernetes_sd_configs, role: pod), not through the
# Gateway/Tailscale ingress paths, so this is the only allowance /metrics needs. Same
# podSelector-scoped pattern as studylife-ai's own k8s/05-network-policies.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-studylife-mcp
  namespace: studylife-mcp
spec:
  podSelector: { matchLabels: { app: studylife-mcp } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: prometheus } }
      ports:
        - { protocol: TCP, port: 8000 }

# NOTE: this namespace has no default-deny EGRESS (only ingress, see default-deny-ingress
# above) - egress to StudyLife is open by default from THIS side. But studylife-scale (where
# StudyLife itself lives) DOES have a default-deny-ingress of its own - reaching studylife-web
# also requires an explicit allow-rule on ITS side, added to the studylife repo's own
# k8s/12-network-policies.yaml (allow-studylife-mcp-to-web), not here. Metrics/liveness probes
# from kubelet aren't subject to NetworkPolicy at all (they originate from the node, not a
# pod), so k8s/04-app.yaml's probes need no allowance either.
---
# Egress for the server pod. Its only outbound dependency is StudyLife itself:
# STUDYLIFE_BASE_URL = https://studylife-web.studylife-scale.svc.cluster.local
# (k8s/01-config.yaml), used by every MCP tool call (client.py) and by the OAuth provider's
# key check (oauth_provider._validate_studylife_key). NetworkPolicy matches the POD port, not
# the Service port: studylife-scale's studylife-web Service maps 443 -> 8443 and 80 -> 8080,
# so the HTTPS base URL above lands on container port 8443. 8080 is allowed alongside it so
# switching the base URL to plain HTTP needs no further policy change.
#
# Nothing else is needed outbound: MCP_PUBLIC_URL/STUDYLIFE_CONNECT_URL are only ever
# rendered into redirect URLs for the user's browser (server.py) - this pod never fetches
# them - the OAuth state lives in a local SQLite file on the PVC, and the remote MCP clients
# are pure INGRESS (Gateway / Tailscale funnel, allowed above). DNS is covered by allow-dns;
# kubelet probes are not subject to NetworkPolicy at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studylife-mcp-egress
  namespace: studylife-mcp
spec:
  podSelector: { matchLabels: { app: studylife-mcp } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-web } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8443 }
