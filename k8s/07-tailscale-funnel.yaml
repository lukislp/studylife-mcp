# Public exposure via Tailscale Funnel (see docs/decisions.md's "Public exposure: Tailscale
# Funnel" entry) - separate from k8s/06-httproute.yaml, which only ever serves
# studylife-mcp.heim.lan inside the tailnet/LAN. This Ingress is the ONE thing in the whole
# cluster allowed to become reachable from the public internet, and that's enforced by the
# tailnet ACL policy itself, not just by convention:
#
#   - The Tailscale Kubernetes operator's default proxy tag (tag:k8s) does NOT have the
#     "funnel" node capability - only the dedicated tag:studylife-mcp-funnel does (see the
#     tagOwners/nodeAttrs blocks in the tailnet policy, login.tailscale.com/admin/acls/file).
#   - tailscale.com/tags below overrides this Ingress's proxy away from the (funnel-incapable)
#     default tag to that dedicated one - the ONLY proxy in the cluster tagged that way.
#   - Any other Ingress created later (for a different service) would still default to
#     tag:k8s, which the ACL doesn't grant funnel to - adding tailscale.com/funnel: "true" to
#     it alone would NOT be enough to make it public; someone would have to also deliberately
#     override its tag to tag:studylife-mcp-funnel (or grant a new tag its own funnel policy),
#     which is a conscious second step, not an accident.
#
# The operator's proxy StatefulSet for this Ingress runs in the "tailscale" namespace (not
# this one) - k8s/05-network-policies.yaml's allow-tailscale-to-studylife-mcp rule is what
# actually lets its traffic reach the pod.
#
# Explicit path allowlist, NOT a defaultBackend: only the routes a remote MCP client
# actually needs (the protocol endpoint, the OAuth dance, discovery metadata) are reachable
# from the public internet. /connected-apps (the self-service "revoke a client's access"
# page, oauth_provider.py) is deliberately absent - it stays reachable only via
# k8s/06-httproute.yaml's studylife-mcp.heim.lan route (tailnet/LAN only), since it lets a
# caller view/manage which clients hold live access to a StudyLife account and shouldn't be
# reachable by anyone who merely finds this public URL. Same principle as the ACL tag
# scoping above: enforced structurally (the ingress controller 404s an unlisted path before
# it ever reaches the pod - the operator's own path matching is prefix-only even for an
# "Exact" pathType, see docs.tailscale.com/kubernetes-operator/reference/limitations), not
# left to remembering not to link it anywhere.
#
# Bootstrap-only, NOT Flux-managed - same RBAC reasoning as k8s/06-httproute.yaml
# (kustomize-controller's ClusterRole has no permission on the networking.k8s.io Ingress
# resource at all).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studylife-mcp-funnel
  namespace: studylife-mcp
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/tags: "tag:studylife-mcp-funnel"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend: {service: {name: studylife-mcp, port: {number: 8000}}}
          - path: /register
            pathType: Prefix
            backend: {service: {name: studylife-mcp, port: {number: 8000}}}
          - path: /authorize
            pathType: Prefix
            backend: {service: {name: studylife-mcp, port: {number: 8000}}}
          - path: /token
            pathType: Prefix
            backend: {service: {name: studylife-mcp, port: {number: 8000}}}
          - path: /revoke
            pathType: Prefix
            backend: {service: {name: studylife-mcp, port: {number: 8000}}}
          - path: /login
            pathType: Prefix
            backend: {service: {name: studylife-mcp, port: {number: 8000}}}
          - path: /.well-known
            pathType: Prefix
            backend: {service: {name: studylife-mcp, port: {number: 8000}}}
  tls:
    - hosts:
        - studylife-mcp
