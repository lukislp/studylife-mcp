# HTTPRoute for the NGF gateway (studylife repo's k8s/07c-gateway.yaml). Both hostnames below
# are internal-only, same trust level, matching every other service on this shared Gateway:
# heim.lan is LAN-only DNS; the lukas2311-homelab.com one is NOT public internet exposure -
# it's only a vehicle for a trusted (Cloudflare-issued) certificate on traffic NGINX Proxy
# Manager terminates and forwards inside the network, never port-forwarded out. Neither is the
# public/internet-reachable path studylife-mcp actually has - that's Tailscale Funnel, a
# separate thing entirely (see docs/decisions.md's "Public exposure" entry), which is also why
# k8s/07-tailscale-funnel.yaml's path allowlist doesn't apply here at all: /connected-apps is
# fully reachable on both hostnames below, by design, unlike on the Funnel path.
#
# Hostname is "heim.lan", not "home.lan" - matches the live convention every other listener on
# that shared Gateway actually uses (confirmed via `kubectl -n nginx-gateway get gateway
# studylife-gateway -o yaml`), which had drifted from that repo's own k8s/07c-gateway.yaml file
# at some point before this listener was added. Deliberately NO BackendTLSPolicy,
# unlike studylife-web/uptime-kuma/grafana's HTTPRoutes in the studylife repo: this server's
# own HTTP transport (main_http, see Dockerfile/README) only ever speaks plain HTTP - it does
# not terminate TLS itself, by design ("run this behind your own reverse proxy"). A
# BackendTLSPolicy here would make the Gateway attempt a TLS handshake against a backend that
# doesn't speak TLS, which would break routing rather than add security - flagged explicitly
# in case this repo's specific NGF setup turns out to need one universally regardless (would
# surface as a real connection error on first test, not a silent misconfiguration).
#
# Requires a DNS entry for studylife-mcp.heim.lan pointing at the Gateway's MetalLB IP, plus
# an NGINX Proxy Manager proxy host forwarding studylife-mcp.lukas2311-homelab.com to that
# same hostname (SNI stays heim.lan, the public Host header passes through) - both separate,
# manual steps outside this repo/the studylife repo's k8s/, same as every other service on
# this Gateway is already set up.
#
# Bootstrap-only, NOT Flux-managed - same RBAC reasoning as k8s/00-namespace.yaml/
# k8s/02-secret.yaml/k8s/05-network-policies.yaml (kustomize-controller's ClusterRole has no
# permission on the gateway.networking.k8s.io/gateway.nginx.org API groups at all).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: studylife-mcp
  namespace: studylife-mcp
spec:
  parentRefs:
    - name: studylife-gateway
      namespace: nginx-gateway
  hostnames:
    - studylife-mcp.heim.lan
    - studylife-mcp.lukas2311-homelab.com
  rules:
    - backendRefs:
        - name: studylife-mcp
          port: 8000
---
# Same modest rate limit as the studylife repo's other exposed heim.lan services
# (k8s/07d-httproutes.yaml) - personal-scale traffic, no reason to diverge.
apiVersion: gateway.nginx.org/v1alpha1
kind: RateLimitPolicy
metadata:
  name: studylife-mcp-rate-limit
  namespace: studylife-mcp
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: studylife-mcp
  rateLimit:
    local:
      rules:
        - zoneSize: 10m
          key: "$binary_remote_addr"
          rate: 20r/s
          burst: 200
          noDelay: true
    rejectCode: 503
